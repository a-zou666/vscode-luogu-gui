function pushRecord(status, extra) {

      data: Object.assign({ type: 'updateRecord', data: Object.assign({

<script src="../../dist/webview-workbench.js"></script>
<script>
// ── 场景编排：把 UI 驱动到目标状态后打标记，供外部截图脚本轮询 ──
function q(sel) { return document.querySelector(sel); }
function qa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function byText(sel, text) {
  return qa(sel).filter(function (e) { return e.textContent.trim().indexOf(text) === 0; })[0];
}
function setNativeValue(el, value) {
  var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
  setter.call(el, value);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
function waitFor(fn, cb, tries) {
  tries = tries === undefined ? 100 : tries;
  if (fn()) return cb();
  if (tries <= 0) return cb(new Error('timeout'));
  setTimeout(function () { waitFor(fn, cb, tries - 1); }, 50);
}

function run() {
  var scene = SCENE;

  // 默认落在题单广场一级页
  waitFor(function () { return qa('.wb-chip').length > 0; }, function (err) {
    if (err) return finish(err);
    if (scene === 'plaza') return finish();

    // 题单内题目列表（二级页）：广场里点一条题单行（button.wb-row）
    if (scene === 'training') {
      return waitFor(function () { return q('.wb-list button.wb-row'); }, function (err) {
        if (err) return finish(err);
        q('.wb-list button.wb-row').click();
        waitFor(function () { return q('.wb-toolbar .wb-crumb'); }, function (err) { finish(err); });
      });
    }

    // 搜索题目
    if (scene === 'search') {
      var btn = byText('.wb-btn', '搜索题目');
      if (btn) btn.click();
      return waitFor(function () { return q('.wb-input'); }, function (err) {
        if (err) return finish(err);
        var input = qa('.wb-input').filter(function (i) { return /关键词|搜索/.test(i.placeholder || ''); })[0];
        if (input) setNativeValue(input, 'A+B');
        var go = byText('.wb-btn', '搜索');
        if (go) go.click();
        waitFor(function () { return q('.wb-list .wb-pid'); }, function (err) { finish(err); });
      });
    }

    // 题目详情：广场 → 题单 → 题目行 → 内嵌题面。
    // 两级列表的 .wb-row 同名但语义不同：题单行是 <button>，题目行是 <div>。
    // 早先只点了一次，UI 停在题单页，.wb-detail-head 永远等不到；超时又被
    // 嵌套回调吞掉，于是「失败」被写成了 data-ready=1 —— 表现就是
    // problem.png 与 training.png 字节数一模一样。这里既补第二跳，也把
    // err 逐层传出去，让失败重新变成失败。
    if (scene === 'problem') {
      return waitFor(function () { return q('.wb-list button.wb-row'); }, function (err) {
        if (err) return finish(err);
        q('.wb-list button.wb-row').click();
        waitFor(function () { return q('.wb-list div.wb-row'); }, function (err) {
          if (err) return finish(err);
          q('.wb-list div.wb-row').click();
          waitFor(function () { return q('.wb-detail-head'); }, function (err) {
            if (err) return finish(err);
            waitFor(function () { return q('.wb-detail article'); }, function (err) { finish(err); });
          });
        });
      });
    }

    // 提交页：验证码按需出现
    if (scene === 'captcha' || scene === 'submit' || scene === 'result') {
      var tab = byText('.wb-tab', '提交');
      if (tab) tab.click();
      return waitFor(function () { return q('.wb-target'); }, function (err) {
        if (err) return finish(err);
        setNativeValue(q('.wb-target'), 'P1001');
        if (scene === 'captcha') {
          var go = byText('.wb-btn', '提交评测');
          if (go) go.click();
          return waitFor(function () { return q('.wb-captcha'); }, function (err) {
            if (err) return finish(err);
            waitFor(function () { return q('.wb-captcha-img'); }, function (err) { finish(err); });
          });
        }
        if (scene === 'submit') return finish();
        // result：提交后等评测结果推送到位
        var go2 = byText('.wb-btn', '提交评测');
        if (go2) go2.click();
        waitFor(function () { return q('.wb-verdict-name'); }, function (err) { finish(err); });
      });
    }

    finish();
  });
}
function finish(err) {
  document.documentElement.setAttribute('data-ready', err ? 'error:' + err.message : '1');
}

window.addEventListener('load', function () { setTimeout(run, 100); });
</script>
